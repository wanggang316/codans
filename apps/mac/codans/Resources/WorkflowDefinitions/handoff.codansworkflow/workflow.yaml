schema: codans.workflow/v1
id: codans.handoff
name: Handoff
description: Prepare a packet and confirm that a receiver has understood it.
inputs:
  note:
    type: string
    default: ""
    description: Optional additional handoff instructions. The task objective comes from the current conversation.
roles:
  author:
    label: Author
    source: current
  receiver:
    label: Receiver
    source: launch
nodes:
  briefing:
    title: Prepare briefing
    uses: codans/agent.request@v1
    role: author
    with:
      context:
        note:
          ref: inputs.note
      instruction:
        value: Summarize this conversation for handoff. Infer the objective from the current task; do not ask the user to repeat it. Preserve user constraints, completed
          work, verification evidence and unresolved questions. Do not perform new task work.
          Use level-two Markdown headings (##) for the required sections. Include concrete next steps and verification commands. Submit the briefing through delivery, then stop working on the transferred task.
    expect:
      format: markdown
      sections:
      - Objective
      - Current State
      - Completed Work
      - Next Steps
  context:
    title: Save briefing and session context
    uses: codans/handoff.context.save@v1
    needs: [briefing]
    with:
      briefing:
        ref: nodes.briefing.outputs.result
      mode:
        value: transition
  packet:
    title: Save immutable packet
    uses: codans/handoff.packet.create@v1
    needs: [context]
    with:
      briefing:
        ref: nodes.context.outputs.briefing
  launch_receiver:
    title: Start receiver
    uses: codans/session.launch@v1
    role: receiver
    needs:
    - packet
  receive:
    title: Read and acknowledge
    uses: codans/agent.request@v1
    role: receiver
    needs:
    - packet
    - launch_receiver
    with:
      context:
        packet:
          ref: nodes.packet.outputs.packet
      instruction:
        value: Read the complete packet. Return its ID and digest, your understanding, a concrete
          next action and blockers. Do not execute the task yet.
    expect:
      format: json
      schema:
        type: object
        required:
        - packetId
        - packetDigest
        - understanding
        - nextAction
        - blockers
        additionalProperties: false
        properties:
          packetId:
            type: string
            minLength: 1
          packetDigest:
            type: string
            minLength: 1
          understanding:
            type: string
            minLength: 1
          nextAction:
            type: string
            minLength: 1
          blockers:
            type: array
            items:
              type: string
  verify:
    title: Verify acknowledgement
    uses: codans/handoff.ack.verify@v1
    needs:
    - packet
    - receive
    with:
      packet:
        ref: nodes.packet.outputs.packet
      acknowledgement:
        ref: nodes.receive.outputs.result
  resume:
    title: Continue the task
    uses: codans/agent.resume@v1
    role: receiver
    needs: [verify]
    with:
      readiness:
        ref: nodes.verify.outputs.readiness
      context:
        packet:
          ref: nodes.packet.outputs.packet
        acknowledgement:
          ref: nodes.receive.outputs.result
      instruction:
        value: The handoff receipt has been verified. Continue the transferred task from the packet's Next Steps now. Preserve all user constraints and existing authorization. Do not repeat completed work or run another handoff. Report progress and blockers to the user in this terminal.
outputs:
  continuation:
    ref: nodes.resume.outputs.dispatch
  packet:
    ref: nodes.packet.outputs.packet
  acknowledgement:
    ref: nodes.receive.outputs.result
  readiness:
    ref: nodes.verify.outputs.readiness
