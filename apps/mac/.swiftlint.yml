strict: true

included:
  - codans
  - codans-cli
  - CodansKit
  - CodansCore
  - CodansCoreTests
  - CodansIPC
excluded:
  - ThirdParty/ghostty
  - .build
  - codans.xcodeproj
  - codans.xcworkspace

disabled_rules:
  - file_length
  - closure_parameter_position
  - type_body_length
  - identifier_name
  - trailing_comma
  - function_parameter_count
  - large_tuple
  - line_length

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - async_without_await

inclusive_language:
  # "master" is allowed: it appears in the Master Terminal feature
  # (the privileged summon-by-hotkey panel that drives the pane fleet
  # via the codans CLI). The term is product-naming, not a git-branch / DB
  # source-of-truth metaphor.
  override_allowed_terms:
    - master

opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_type_headers: true

cyclomatic_complexity:
  warning: 15
  error: 20

function_body_length:
  warning: 100
  error: 150

nesting:
  type_level: 2

redundant_discardable_let:
  ignore_swiftui_view_bodies: true
