name: release

# Tag-triggered Developer ID release pipeline. Pushing a `v*` tag (e.g.
# `v0.1.0`) produces a notarized + stapled `Codans-<version>.dmg`
# attached to a draft GitHub Release.
#
# Required GitHub repository secrets (set via `gh secret set` or web UI):
#   DEVELOPER_ID_CERT_P12_BASE64  - base64 -i path/to/devid.p12
#   DEVELOPER_ID_CERT_PASSWORD    - .p12 export password
#   KEYCHAIN_PASSWORD             - openssl rand -base64 32 (per-run)
#   DEVELOPMENT_TEAM              - 10-char team ID, e.g. HC438T2B8P
#   AC_API_KEY_ID                 - App Store Connect API Key ID
#   AC_API_ISSUER_ID              - App Store Connect Issuer UUID
#   AC_API_KEY_P8                 - base64 -i AuthKey_*.p8
#   SPARKLE_PRIVATE_KEY           - EdDSA private key (the base64 string
#                                   produced by `generate_keys -x`,
#                                   counterpart of SUPublicEDKey in
#                                   apps/mac/Configurations/mac-Info.plist)
#
# Optional secrets — release succeeds without these, but the published
# build will not report crashes (or will report unsymbolicated stacks):
#   SENTRY_DSN_REST               - host+path portion of the Sentry DSN
#                                   (everything after `https://`). When
#                                   absent the bundle ships with an empty
#                                   DSN and crash reporting no-ops at
#                                   launch — see docs/references/crash-reporting.md.
#   SENTRY_AUTH_TOKEN             - scopes project:read, project:write,
#                                   project:releases. Needed to register
#                                   the Sentry release and upload dSYMs;
#                                   absence is non-fatal but stack traces
#                                   stay unsymbolicated in the dashboard.
#   SENTRY_ORG                    - Sentry organisation slug (matches the
#                                   `org` field of ~/.sentryclirc).
#   SENTRY_PROJECT                - Sentry project slug or numeric ID. All
#                                   three SENTRY_* upload secrets must be
#                                   present for dSYM upload to run; the
#                                   script no-ops cleanly when any is
#                                   missing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, format vX.Y.Z)'
        required: true

permissions:
  contents: write   # needed for gh release create

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # macos-26 ships several Xcode versions; the default symlink at
      # /Applications/Xcode.app currently points at 26.2, whose SDK
      # treats SwiftUICore.tbd as a private framework with a bundle-id
      # allowed-clients list that does not include our app, breaking
      # the link step. Xcode 26.0 (our local pinned floor) does not
      # have this restriction. Export DEVELOPER_DIR for every later
      # step — apps/mac/Makefile has `export DEVELOPER_DIR ?= …Xcode.app…`
      # which would otherwise fall back to the 26.2-symlink.
      - name: Pin Xcode 26.0
        run: |
          XCODE_DEV=/Applications/Xcode_26.0.app/Contents/Developer
          [ -d "$XCODE_DEV" ] || { echo "::error::$XCODE_DEV missing on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE_DEV"
          echo "DEVELOPER_DIR=$XCODE_DEV" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' does not match vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Verify tag matches MARKETING_VERSION
        run: |
          MV=$(awk -F'=' '/^MARKETING_VERSION/ {gsub(/[ \t]/,"",$2); print $2}' apps/mac/Configurations/Project.xcconfig)
          if [[ "$MV" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "::error::tag ${{ steps.meta.outputs.tag }} != Project.xcconfig MARKETING_VERSION ($MV); bump-version before tagging" >&2
            exit 1
          fi

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          experimental: true
          # mise-action exports MISE_TRUSTED_CONFIG_PATHS pointing at
          # the workspace, so a separate `mise trust` call is redundant
          # (and would fail because `mise trust` accepts only one path).

      # Most of an archive's wall time is rebuilding GhosttyKit (Zig
      # cross-compilation, ~5-10 min cold). Cache by submodule SHA +
      # script + mise.toml — the same fingerprint scripts/build-ghostty.sh
      # uses internally.
      # Read the Xcode version into env so cache keys vary across
      # runner-image upgrades (different Xcode → different SDK →
      # different XCFramework byte content).
      - name: Capture Xcode version for cache keys
        run: |
          XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/_/g; s/-$//')"
          GHOSTTY_SHA="$(git -C apps/mac/ThirdParty/ghostty rev-parse HEAD)"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "GHOSTTY_SHA=$GHOSTTY_SHA"     >> "$GITHUB_ENV"

      - name: Cache GhosttyKit XCFramework
        uses: actions/cache@v4
        with:
          path: apps/mac/.build/ghostty
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ env.GHOSTTY_SHA }}-${{ hashFiles('apps/mac/scripts/build-ghostty.sh', 'mise.toml') }}

      # Tuist resolves SPM dependencies into Tuist/.build; this is large
      # but deterministic across runs with unchanged Package.resolved.
      - name: Cache Tuist SPM checkouts
        uses: actions/cache@v4
        with:
          path: apps/mac/Tuist/.build
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('apps/mac/Tuist/Package.swift', 'apps/mac/Tuist/Package.resolved') }}

      - name: Import Developer ID certificate into temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          P12_PATH="$RUNNER_TEMP/devid.p12"

          # Decode (strip whitespace/CRs that can land in pasted secrets)
          printf '%s' "$P12_BASE64" | tr -d ' \n\r\t' | base64 -D > "$P12_PATH"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          # Prepend our keychain so codesign and security find-identity see it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"

          # Extract the SHA-1 fingerprint of the imported identity.
          # release.sh passes this as the CODE_SIGN_IDENTITY xcodebuild
          # build setting on the command line — using the SHA (not
          # "Developer ID Application: <name>") avoids ambiguity when
          # the keychain has multiple Developer ID certs and removes
          # the need for a separate DEVELOPER_ID_NAME secret.
          IDENTITY_SHA="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY_SHA" ]; then
            echo "::error::Developer ID Application identity not found after import"
            exit 1
          fi
          echo "DEVELOPER_ID_IDENTITY_SHA=$IDENTITY_SHA" >> "$GITHUB_ENV"

          rm -f "$P12_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Inject Sentry DSN into Secrets.xcconfig
        # xcconfig is read by xcodebuild at Archive time. Without this
        # step the CI build links against a SentryDSN of bare "https://",
        # which CrashReporting.Configuration rejects and the SDK never
        # starts — every release would silently lose crash visibility.
        # Empty SENTRY_DSN_REST is intentionally tolerated: useful when
        # cutting a release before the secret is provisioned.
        env:
          SENTRY_DSN_REST: ${{ secrets.SENTRY_DSN_REST }}
        run: |
          if [ -z "$SENTRY_DSN_REST" ]; then
            echo "::warning::SENTRY_DSN_REST secret is empty; release will ship without crash reporting"
          fi
          printf 'SENTRY_DSN_REST = %s\n' "$SENTRY_DSN_REST" \
            > apps/mac/Configurations/Secrets.xcconfig

      - name: Archive (xcodebuild archive + extract signed app)
        env:
          APPLE_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: make mac-archive

      - name: Verify embedded telemetry config
        # Defense-in-depth against silently shipping a release whose crash
        # reporting is dead. The Inject step above deliberately tolerates an
        # empty SENTRY_DSN_REST (release cut before the secret is
        # provisioned), so this assertion only runs when the secret IS
        # present. In that case the exported app's embedded SentryDSN must
        # reassemble to a valid `https://<host>…` — exactly what
        # CrashReporting.Configuration accepts at launch. A bare scheme, an
        # empty host, or an unexpanded $(SENTRY_DSN_REST) placeholder fails
        # the release here instead of quietly disabling crash visibility for
        # every user of the build. Runs right after Archive so a broken
        # bundle fails before notarization/dSYM upload waste minutes.
        env:
          SENTRY_DSN_REST: ${{ secrets.SENTRY_DSN_REST }}
        run: |
          set -euo pipefail
          PLIST="apps/mac/.build/release/export/Codans.app/Contents/Info.plist"
          if [ -z "${SENTRY_DSN_REST}" ]; then
            echo "::notice::SENTRY_DSN_REST empty — skipping embedded telemetry verification (crash reporting intentionally no-ops for this build)"
            exit 0
          fi
          DSN="$(/usr/libexec/PlistBuddy -c 'Print :SentryDSN' "$PLIST")"
          # Trim surrounding whitespace/newlines, mirroring the trimming in
          # CrashReporting.Configuration so this gate matches runtime accept.
          DSN="${DSN#"${DSN%%[![:space:]]*}"}"
          DSN="${DSN%"${DSN##*[![:space:]]}"}"
          case "$DSN" in
            *'$(SENTRY_DSN_REST)'*)
              echo "::error::embedded SentryDSN still holds the literal \$(SENTRY_DSN_REST) placeholder — xcconfig substitution did not run"
              exit 1 ;;
          esac
          HOST="${DSN#https://}"
          if [ "$DSN" = "$HOST" ] || [ -z "$HOST" ]; then
            echo "::error::embedded SentryDSN is not a valid https URL with a non-empty host — release would ship with broken/absent crash reporting"
            exit 1
          fi
          echo "embedded SentryDSN verified (https://<redacted host>)"

      - name: Upload dSYMs to Sentry
        # Registers the release `codans@<version>` on Sentry and
        # pushes the dSYMs from the .xcarchive so future crashes resolve
        # to readable source lines. The script no-ops cleanly when
        # SENTRY_AUTH_TOKEN is unset, keeping the workflow tolerant of
        # secret-not-yet-provisioned states. Runs immediately after
        # Archive (and therefore before notarization/stapling) because
        # notarize mutates the .app bundle but leaves the .xcarchive
        # dSYMs untouched.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        run: ./apps/mac/scripts/release.sh upload-symbols

      - name: Notarize app
        env:
          AC_API_KEY_ID:    ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8:    ${{ secrets.AC_API_KEY_P8 }}
        run: |
          ./apps/mac/scripts/release.sh notarize \
            apps/mac/.build/release/export/Codans.app

      - name: Build DMG
        run: ./apps/mac/scripts/release.sh dmg

      - name: Notarize DMG
        env:
          AC_API_KEY_ID:    ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8:    ${{ secrets.AC_API_KEY_P8 }}
        run: |
          ./apps/mac/scripts/release.sh notarize \
            "apps/mac/.build/release/Codans-${{ steps.meta.outputs.version }}.dmg"

      # ---- Sparkle appcast.xml (Stage 2 of the in-app updater) ----
      # The notarized DMG is the unit Sparkle's appcast advertises. We
      # download Sparkle's prebuilt tools from its release tarball
      # (the SPM checkout only ships the framework, not the CLI tools)
      # and run generate_appcast against a staging directory holding
      # only the current DMG. The EdDSA private key counterpart of the
      # Info.plist's SUPublicEDKey is read from $SPARKLE_PRIVATE_KEY
      # via stdin (`--ed-key-file -`) so it never lands on disk.
      - name: Fetch Sparkle CLI tools
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.9.1/Sparkle-2.9.1.tar.xz \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          ls -l "$RUNNER_TEMP/sparkle/bin/generate_appcast"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Generate signed appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?secret SPARKLE_PRIVATE_KEY not configured}"
          STAGING="$RUNNER_TEMP/appcast-staging"
          mkdir -p "$STAGING"
          /bin/cp "apps/mac/.build/release/Codans-${{ steps.meta.outputs.version }}.dmg" "$STAGING/"
          # generate_appcast embeds the download-url-prefix in each item's
          # <enclosure url="..."> attribute; point at the GitHub Releases
          # download URL for this exact tag so Sparkle clients fetch the
          # DMG that ships in the same release as the appcast itself.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d ' \n\r\t' \
            | "$SPARKLE_BIN/generate_appcast" \
                --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/" \
                --maximum-versions 5 \
                --ed-key-file - \
                "$STAGING"
          /bin/cp "$STAGING/appcast.xml" "apps/mac/.build/release/appcast.xml"
          cat "apps/mac/.build/release/appcast.xml"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # Extract the section for this version (## [X.Y.Z] ... until next ##).
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for ${VERSION}, falling back to tag message"
            NOTES=$(git tag -l "${{ steps.meta.outputs.tag }}" --format='%(contents)')
          fi
          echo "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "Extracted release notes for ${VERSION}:"
          head -5 "$RUNNER_TEMP/release-notes.md"

      # ---- Inject Markdown release notes into appcast.xml ----
      # Sparkle 2 renders `<description sparkle:format="markdown">` natively
      # via NSAttributedString(markdownString:) on macOS 12+ (our floor is
      # 14.0). Without this step the in-app "What's New" pane is blank
      # because `generate_appcast` only stamps version metadata into the
      # `<item>`, never release-note content.
      - name: Inject Markdown release notes into appcast
        run: |
          set -euo pipefail
          APPCAST="apps/mac/.build/release/appcast.xml"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 - "$APPCAST" "$NOTES_FILE" <<'PYEOF'
          import sys, re

          appcast_path, notes_path = sys.argv[1], sys.argv[2]

          with open(notes_path, encoding="utf-8") as f:
              notes = f.read().strip()
          # CDATA cannot contain a literal "]]>"; split it so the section
          # cannot terminate early. The two halves rejoin inside Sparkle's
          # XML parser into the original byte sequence.
          notes = notes.replace("]]>", "]]]]><![CDATA[>")

          with open(appcast_path, encoding="utf-8") as f:
              xml = f.read()

          if "<description" in xml:
              raise SystemExit("appcast already has a <description>; refusing to overwrite")

          block = (
              '            <description sparkle:format="markdown"><![CDATA[\n'
              f"{notes}\n"
              "            ]]></description>\n"
          )
          # Single staging DMG → exactly one <item>; insert before its close tag.
          xml, n = re.subn(r"(?m)^([ \t]*)</item>", block + r"\1</item>", xml, count=1)
          if n != 1:
              raise SystemExit(f"expected exactly one </item> in appcast.xml, found {n}")

          with open(appcast_path, "w", encoding="utf-8") as f:
              f.write(xml)
          print(xml)
          PYEOF

      - name: Create draft GitHub Release with DMG + appcast attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="apps/mac/.build/release/Codans-${{ steps.meta.outputs.version }}.dmg"
          APPCAST="apps/mac/.build/release/appcast.xml"
          # Stable-named copy of the (already notarized) DMG. It carries no
          # version in the filename, so `releases/latest/download/Codans.dmg`
          # is a release-independent direct-download URL the website can link
          # to without editing per release. The versioned DMG, its checksum,
          # the cask, and the Sparkle appcast are unaffected.
          STABLE_DMG="apps/mac/.build/release/Codans.dmg"
          /bin/cp "$DMG" "$STABLE_DMG"
          gh release create "${{ steps.meta.outputs.tag }}" \
            --draft \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$DMG" "$DMG.sha256" "$STABLE_DMG" "$APPCAST"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
