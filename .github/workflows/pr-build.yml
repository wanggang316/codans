name: pr-build

# Build every pull request with the same Xcode as the release pipelines
# (Xcode 26.0, the supported floor), so a change that only the floor
# toolchain rejects fails on the PR instead of on main. Local development
# uses a newer Xcode, which accepts code that Xcode 26.0 does not (for
# example, expressions that time out in the Swift 6.2 type checker).
#
# The build matches `release.sh archive` (Release, arm64, generic macOS)
# without signing, so it needs no secrets.
#
# It also runs on pushes to main. A pull request can restore only caches
# that its own runs or main saved, and a cache is saved only when the job
# succeeds, so the main runs keep a warm cache for every new pull request.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mac/**"
      - "mise.toml"
      - ".github/workflows/pr-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/mac/**"
      - "mise.toml"
      - ".github/workflows/pr-build.yml"
  workflow_dispatch: {}

# A new push to a pull request cancels its older run. Runs on main are not
# cancelled, so each one can save its caches.
concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # Same pin and reason as release.yml.
      - name: Pin Xcode 26.0
        run: |
          XCODE_DEV=/Applications/Xcode_26.0.app/Contents/Developer
          [ -d "$XCODE_DEV" ] || { echo "::error::$XCODE_DEV missing on this runner image"; exit 1; }
          sudo xcode-select -s "$XCODE_DEV"
          echo "DEVELOPER_DIR=$XCODE_DEV" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          experimental: true

      - name: Capture Xcode version for cache keys
        run: |
          XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/_/g; s/-$//')"
          GHOSTTY_SHA="$(git -C apps/mac/ThirdParty/ghostty rev-parse HEAD)"
          echo "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          echo "GHOSTTY_SHA=$GHOSTTY_SHA"     >> "$GITHUB_ENV"

      # Same keys as release-tip.yml, so a PR reuses the caches that main
      # builds wrote.
      - name: Cache GhosttyKit XCFramework
        uses: actions/cache@v4
        with:
          path: apps/mac/.build/ghostty
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ env.GHOSTTY_SHA }}-${{ hashFiles('apps/mac/scripts/build-ghostty.sh', 'apps/mac/scripts/xcode-compat/**', 'mise.toml') }}

      - name: Cache Tuist SPM checkouts
        uses: actions/cache@v4
        with:
          path: apps/mac/Tuist/.build
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('apps/mac/Tuist/Package.swift', 'apps/mac/Tuist/Package.resolved') }}

      # build-zmx.sh skips the build when bin/zmx and a matching
      # .fingerprint exist, so a restored cache saves the zig build.
      - name: Capture zmx fingerprint for the cache key
        run: echo "ZMX_FINGERPRINT=$(apps/mac/scripts/build-zmx.sh --print-fingerprint)" >> "$GITHUB_ENV"

      - name: Cache zmx binary
        uses: actions/cache@v4
        with:
          path: |
            apps/mac/.build/zmx/bin
            apps/mac/.build/zmx/.fingerprint
          key: zmx-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ env.ZMX_FINGERPRINT }}

      - name: Generate project and build zmx
        run: make mac-generate mac-build-zmx

      - name: Build Codans (Release, unsigned)
        working-directory: apps/mac
        # xcbeautify drops some failures (for example a compiler crash) with
        # no message, so keep the raw log and print its errors on failure.
        run: |
          set -o pipefail
          RAW_LOG="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild build \
            -workspace codans.xcworkspace \
            -scheme Codans \
            -configuration Release \
            -destination "generic/platform=macOS" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RAW_LOG" | mise exec -- xcbeautify || {
              echo "::group::Errors from the raw xcodebuild log"
              grep -nE -B2 -A12 "error:|Stack dump|PLEASE submit a bug report|Command SwiftCompile failed|signal" "$RAW_LOG" | head -400
              echo "::endgroup::"
              exit 1
            }
